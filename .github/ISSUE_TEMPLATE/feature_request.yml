name: Feature request
description: Suggest a new capability or workflow improvement
title: "[feat] "
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the paper-reading situation where the current workflow falls short.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Which script / section / template would change, and how?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - extraction (PDF → text / figures)
        - note writing (SKILL.md rules)
        - validation & QA scripts
        - formulas
        - export (PDF / Obsidian)
        - install & environment
        - docs
    validations:
      required: true
