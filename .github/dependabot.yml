version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # pymupdf 2.x requires Python >= 3.11; revisit when 3.10 support is dropped.
      - dependency-name: pymupdf
        update-types: ["version-update:semver-major"]
    groups:
      python-deps:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
